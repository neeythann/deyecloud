site_name: deyecloud
site_description: A Python wrapper for the Deye Cloud API, modeled after PRAW.
site_url: https://deyecloud.readthedocs.io/
repo_url: https://github.com/neeythann/deyecloud
repo_name: neeythann/deyecloud

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.top
    - content.code.copy
    - navigation.expand

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Stations: guides/stations.md
      - Devices: guides/devices.md
      - Control commands: guides/control.md
      - Streaming telemetry: guides/streaming.md
      - Configuration and strategies: guides/config-strategies.md
  - API reference:
      - DeyeCloud: api/deyecloud.md
      - Helpers: api/helpers.md
      - Station: api/station.md
      - Device: api/device.md
      - Order: api/order.md
      - Supporting classes: api/supporting.md
      - Exceptions: api/exceptions.md

markdown_extensions:
  - admonition
  - codehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true

plugins:
  - search
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_signature: true
            show_signature_annotations: true
            docstring_style: sphinx
