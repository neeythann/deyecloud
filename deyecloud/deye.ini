[DEFAULT]
# Required settings (can also be passed as keyword arguments to the DeyeCloud
# class, or set as environment variables prefixed with ``deye_``).
#
# app_id:     The developer application identifier, e.g. 201911067156002
# app_secret: The secret paired with app_id
# password:   The account password (will be SHA-256 hashed before sending)
#
# Exactly one login identifier is required: email, mobile, or username.
# If mobile is used, country_code must be provided as well.
#
#   email = user@example.com
#   mobile = 5551234567
#   country_code = 49
#   username = myaccount
#
# company_id: When provided, a "business member" token is requested. The value
#             can be discovered via ``deye.account.info()``. Leave unset for a
#             personal-user token.
base_url = https://eu1-developer.deyecloud.com
timeout = 30

[other_site]
# An optional named section, selected by passing ``site_name="other_site"`` to
# the DeyeCloud class, e.g. for a different regional deployment.
# base_url = https://global-developer.deyecloud.com
